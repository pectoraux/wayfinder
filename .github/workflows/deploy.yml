# Wayfinder — Deploy to Vercel on push to main
#
# This workflow deploys to Vercel using the Vercel CLI, which bypasses the
# Vercel REST API rate limit (100/day on the free plan). It triggers on every
# push to main and on manual dispatch.
#
# Required GitHub secrets:
#   VERCEL_TOKEN  — the Vercel API token
#   VERCEL_ORG_ID — the Vercel team/org id
#   VERCEL_PROJECT_ID — the Vercel project id

name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Run tests
        run: bun run test
        env:
          DATABASE_URL: file:/tmp/wayfinder-test.db
          NEXTAUTH_SECRET: ci-test-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000

      - name: Regenerate Prisma Client for production (PostgreSQL)
        run: bun run db:generate:prod
        env:
          DATABASE_URL: file:/tmp/wayfinder-test.db

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Apply production database schema (additive, no data loss)
        run: |
          # Extract DATABASE_URL from the Vercel-pulled env file
          export DATABASE_URL=$(grep '^DATABASE_URL=' .vercel/.env.production.local | cut -d'=' -f2- | tr -d '"')
          export DIRECT_DATABASE_URL=$(grep '^DIRECT_DATABASE_URL=' .vercel/.env.production.local | cut -d'=' -f2- | tr -d '"' || true)
          echo "DATABASE_URL length: ${#DATABASE_URL}"
          npx prisma db push --accept-data-loss
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: |
          # Regenerate Prisma Client for production RIGHT BEFORE the Vercel build,
          # using the Vercel-pulled env (which has the production DATABASE_URL).
          # This ensures the Prisma query engine matches the Vercel runtime
          # (rhel-openssl-3.0.x), not the SQLite engine from the test step.
          export DATABASE_URL=$(grep '^DATABASE_URL=' .vercel/.env.production.local | cut -d'=' -f2- | tr -d '"')
          npx prisma generate
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
